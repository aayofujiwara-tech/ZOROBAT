<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#0f1029"/>
    </linearGradient>
    <linearGradient id="dice1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2a3d"/>
      <stop offset="100%" stop-color="#0d1a2a"/>
    </linearGradient>
    <linearGradient id="dice2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d1a0f"/>
      <stop offset="100%" stop-color="#2a1008"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff2d78"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle radial glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)" opacity="0.06"/>
  <!-- Dice 1 (blue/cyan - player) - tilted left, showing 5 -->
  <g transform="translate(148, 160) rotate(-12, 90, 90)">
    <rect width="180" height="180" rx="32" fill="url(#dice1)" stroke="#00e5ff" stroke-width="3" stroke-opacity="0.4"/>
    <!-- 5 dots -->
    <circle cx="50" cy="50" r="16" fill="#00e5ff"/>
    <circle cx="130" cy="50" r="16" fill="#00e5ff"/>
    <circle cx="90" cy="90" r="16" fill="#00e5ff"/>
    <circle cx="50" cy="130" r="16" fill="#00e5ff"/>
    <circle cx="130" cy="130" r="16" fill="#00e5ff"/>
  </g>
  <!-- Dice 2 (orange - opponent) - tilted right, showing 5 -->
  <g transform="translate(184, 192) rotate(10, 90, 90)">
    <rect width="180" height="180" rx="32" fill="url(#dice2)" stroke="#ff6b35" stroke-width="3" stroke-opacity="0.4"/>
    <!-- 5 dots -->
    <circle cx="50" cy="50" r="16" fill="#ff6b35"/>
    <circle cx="130" cy="50" r="16" fill="#ff6b35"/>
    <circle cx="90" cy="90" r="16" fill="#ff6b35"/>
    <circle cx="50" cy="130" r="16" fill="#ff6b35"/>
    <circle cx="130" cy="130" r="16" fill="#ff6b35"/>
  </g>
</svg>
